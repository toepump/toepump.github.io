{% component page_publish_metadata(page, @config) %}
{# Post author is always toepump, so only show the date. #}
<span class="icon-text has-text-grey">
  <span class="icon">
    <i class="far fa-calendar-alt"></i>
  </span>
  <span><time datetime="{{ page.date }}">{{ page.date | date(format='%B %d, %Y') }}</time></span>
</span>
{% endcomponent page_publish_metadata %}
